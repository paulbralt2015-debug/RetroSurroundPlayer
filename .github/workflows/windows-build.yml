name: Build RetroSurround Player for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download project source
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Configure project
        run: cmake -S . -B build

      - name: Compile application
        run: cmake --build build --config Release --parallel

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          $exe = Get-ChildItem build -Filter RetroSurroundPlayer.exe -Recurse |
            Select-Object -First 1
          if (-not $exe) {
            throw "RetroSurroundPlayer.exe introuvable après compilation."
          }
          Copy-Item $exe.FullName release/
          windeployqt --release --compiler-runtime release/RetroSurroundPlayer.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RetroSurroundPlayer-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 7
